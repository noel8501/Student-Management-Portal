<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick sign-up | CampusFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="logo">CF</span> CampusFlow</a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="site-nav">
      <a href="index.html#features">Features</a>
      <button class="button secondary theme-toggle" type="button">🌙 Dark theme</button>
      <a class="button secondary" href="signin.html">Sign in</a>
    </nav>
  </header>

  <main class="auth-layout auth-layout-single">
    <section class="auth-intro">
      <p class="eyebrow">QUICK ONBOARDING</p>
      <h1>Create your portal account</h1>
      <p>Start with your email and password. You can fill out more student details in your profile later.</p>
    </section>
    <form id="signup-form" class="form-card" novalidate>
      <h2>Sign up</h2>
      <label>Email address
        <input id="signup-email" type="email" autocomplete="email" required>
        <span class="field-error" id="signup-email-error"></span>
      </label>
      <label>Password
        <span class="password-wrap">
          <input id="signup-password" type="password" autocomplete="new-password" required>
          <button class="password-toggle" type="button" data-toggle-password="signup-password">Show</button>
        </span>
        <span class="field-help">Use at least 8 characters, with uppercase, lowercase, number and symbol.</span>
        <span class="field-error" id="signup-password-error"></span>
      </label>
      <label class="checkbox-label">
        <input id="signup-terms" type="checkbox" required>
        <span>I agree to the <a href="#terms">Terms of Service</a>.</span>
      </label>
      <span class="field-error" id="signup-terms-error"></span>
      <p class="form-message" id="signup-message" role="alert" aria-live="polite"></p>
      <button id="signup-submit" class="button primary full-width" type="submit" disabled>Create account</button>
      <p class="form-foot">Already have an account? <a href="signin.html">Sign in</a> · Need a full student profile? <a href="register.html">Register with details</a></p>
    </form>
  </main>

  <script>
    document.querySelector(".menu-toggle").addEventListener("click", () => {
      const nav = document.querySelector(".site-nav");
      const open = nav.classList.toggle("open");
      document.querySelector(".menu-toggle").setAttribute("aria-expanded", String(open));
    });
  </script>
</body>
</html>
